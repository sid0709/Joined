# The production stack on the VPS. The deploy workflow (.github/workflows/deploy.yml)
# copies this file and a .env built from the GitHub "production" environment to
# /srv/joined, then pulls the images it just pushed and starts them.
#
# Joined (joinedhq.com) always runs. The other apps are ready but off: list them in
# the COMPOSE_PROFILES variable (e.g. "scoutwell,admin") to start them.
#
# Every port binds to 127.0.0.1, so nothing is reachable from outside except
# through nginx. Host ports are the dev ports + 3000.
name: joined

x-app: &app
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-api: &api
  <<: *app
  # MongoDB runs on the VPS itself, outside Docker.
  extra_hosts: ["host.docker.internal:host-gateway"]

services:
  joined-backend:
    <<: *api
    image: ${IMAGE_REPO}:joined-backend-${IMAGE_TAG}
    ports: ["127.0.0.1:11080:8080"]
    # Search keeps working while these start: it falls back to the Mongo text
    # search until the vector index and the embedder answer.
    depends_on: [qdrant, redis, embedder]
    volumes:
      # Learned-ranking models (tools/ranking/train_ltr.py output) live here.
      - ./models:/models:ro
    environment:
      MONGO_URI: ${MONGO_URI:-}
      DEST_DB: ${DEST_DB:-JoinedDB}
      CORS_ORIGINS: ${FRONTEND_ORIGIN}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      GOOGLE_SIGNIN_REDIRECT_URL: ${GOOGLE_SIGNIN_REDIRECT_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Personalized ranking (backend-core/ranking). One backend instance runs
      # the indexer; it mirrors Mongo into Qdrant and fans new jobs out to feeds.
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      EMBEDDER_URL: http://embedder:80
      RANKING_INDEXER: "true"
      RANKING_EVENTS: ${RANKING_EVENTS:-true}
      RANKING_MODEL_PATH: ${RANKING_MODEL_PATH:-}
      RANKING_LTR_PERCENT: ${RANKING_LTR_PERCENT:-0}
      # The in-memory index is a large, long-lived heap: collect less often.
      GOGC: "200"

  # The vector index. Original vectors stay on disk (page cache); the int8 copies
  # searches walk stay in RAM. About 1.1 GB per million jobs.
  qdrant:
    <<: *app
    image: qdrant/qdrant:v1.19.1
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]

  # Ranked-result cache, "For you" feeds, and query vectors. Everything in it can
  # be rebuilt, so it keeps nothing on disk and evicts least-recently used.
  redis:
    <<: *app
    image: redis:8.10.2-alpine
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "1gb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 6

  # The embedding model (bge-small-en-v1.5, 384 dimensions) on CPU. Jobs, profiles,
  # and typed queries must all use this one model.
  embedder:
    <<: *app
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    command: ["--model-id", "BAAI/bge-small-en-v1.5", "--max-client-batch-size", "64"]
    ports: ["127.0.0.1:8090:80"]
    volumes: ["embedder:/data"]

  joined-frontend:
    <<: *app
    image: ${IMAGE_REPO}:joined-frontend-${IMAGE_TAG}
    ports: ["127.0.0.1:6002:3000"]
    depends_on: [joined-backend]
    environment:
      JOINED_API_URL: http://joined-backend:8080
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}

  scoutwell-backend:
    <<: *api
    profiles: [scoutwell]
    image: ${IMAGE_REPO}:scoutwell-backend-${IMAGE_TAG}
    ports: ["127.0.0.1:11082:8080"]
    environment:
      MONGO_URI: ${MONGO_URI:-}
      DEST_DB: ${DEST_DB:-JoinedDB}
      CORS_ORIGINS: ${SCOUTWELL_ORIGIN:-}
      GOOGLE_CLIENT_ID: ${SCOUTWELL_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${SCOUTWELL_GOOGLE_CLIENT_SECRET:-}
      GOOGLE_SIGNIN_REDIRECT_URL: ${SCOUTWELL_GOOGLE_SIGNIN_REDIRECT_URL:-}

  scoutwell-frontend:
    <<: *app
    profiles: [scoutwell]
    image: ${IMAGE_REPO}:scoutwell-frontend-${IMAGE_TAG}
    ports: ["127.0.0.1:6003:3000"]
    depends_on: [scoutwell-backend]
    environment:
      SCOUTWELL_API_URL: http://scoutwell-backend:8080
      SCOUT_PUBLIC_API_URL: ${SCOUT_PUBLIC_API_URL:-}
      JOINED_WEB_URL: ${FRONTEND_ORIGIN}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}

  admin-backend:
    <<: *api
    profiles: [admin]
    image: ${IMAGE_REPO}:admin-backend-${IMAGE_TAG}
    ports: ["127.0.0.1:11081:8080"]
    environment:
      MONGO_URI: ${MONGO_URI:-}
      DEST_DB: ${DEST_DB:-JoinedDB}
      CORS_ORIGINS: ${ADMIN_ORIGIN:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_CLIENT_ID: ${ADMIN_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${ADMIN_GOOGLE_CLIENT_SECRET:-}
      GOOGLE_SIGNIN_REDIRECT_URL: ${ADMIN_GOOGLE_SIGNIN_REDIRECT_URL:-}
      ADMIN_GOOGLE_DOMAIN: ${ADMIN_GOOGLE_DOMAIN:-}

  admin-frontend:
    <<: *app
    profiles: [admin]
    image: ${IMAGE_REPO}:admin-frontend-${IMAGE_TAG}
    ports: ["127.0.0.1:6010:3000"]
    depends_on: [admin-backend]
    environment:
      ADMIN_API_URL: http://admin-backend:8080
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      JOINED_WEB_URL: ${FRONTEND_ORIGIN}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}

  connected-frontend:
    <<: *app
    profiles: [connected]
    image: ${IMAGE_REPO}:connected-frontend-${IMAGE_TAG}
    # 6000 would follow the +3000 rule, but browsers refuse to open port 6000.
    ports: ["127.0.0.1:6004:3000"]

volumes:
  qdrant:
  embedder:
