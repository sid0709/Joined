# api.joinedhq.com → backend-core's server. Installed once by bootstrap-vps.sh; certbot
# then adds HTTPS to this file, so later changes are made on the server.
#
# Bash's extension calls /bash/... here and holds a Socket.IO connection at
# /bash/socket.io, so websocket upgrades must pass through.
server {
    listen 80;
    listen [::]:80;
    server_name api.joinedhq.com;

    # Bash sends whole page trees to /bash/ai-analyze; the API accepts up to 16 MB.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:11083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        # Defined once, in the joinedhq.com site.
        proxy_set_header Connection $connection_upgrade_joined;
        # The Bash socket stays open while the side panel is; don't cut it after 60s.
        proxy_read_timeout 1h;
    }
}
