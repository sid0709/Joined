# api.joinedhq.com → joined-backend. Installed once by bootstrap-vps.sh; certbot
# then adds HTTPS to this file, so later changes are made on the server.
server {
    listen 80;
    listen [::]:80;
    server_name api.joinedhq.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:11080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        # Defined once, in the joinedhq.com site.
        proxy_set_header Connection $connection_upgrade_joined;
        proxy_read_timeout 1h;
    }
}
