# joinedhq.com → joined-frontend. Installed once by bootstrap-vps.sh; certbot
# then adds HTTPS to this file, so later changes are made on the server.
#
# Only Google's calendar redirect goes straight to joined-backend. Everything else
# reaches the API through the frontend's server, so the API is never public.
server {
    listen 80;
    listen [::]:80;
    server_name joinedhq.com www.joinedhq.com;

    client_max_body_size 10m;

    location = /v1/me/calendar/google/callback {
        proxy_pass http://127.0.0.1:11080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:6002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_joined;
    }

    # Shown while the containers are not running yet, or are restarting.
    error_page 502 503 504 /starting.html;
    location = /starting.html {
        root /var/www/joinedhq;
        internal;
    }
}

map $http_upgrade $connection_upgrade_joined {
    default upgrade;
    ''      close;
}
