<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Acorn</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Acorn</h1>
        <a href="./sheet.html">Sheet player →</a>
      </header>

      <section class="card">
        <div class="stage-wrap">
          <div id="stage" class="face stage bg-checker"></div>
          <div class="sizes" id="sizes"></div>
        </div>
        <div id="moods" class="moods" role="group" aria-label="Mood"></div>
        <div class="row">
          <label for="bg">Stage</label>
          <select id="bg">
            <option value="checker">Checker</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
          <label for="renderer">Renderer</label>
          <select id="renderer">
            <option value="auto">Worker (auto)</option>
            <option value="main">Main thread</option>
          </select>
          <label><input id="reduced" type="checkbox" /> Reduced motion</label>
        </div>
      </section>

      <section class="card">
        <div class="row between">
          <strong>All moods</strong>
          <span class="muted">148px, like the extension's Help page</span>
        </div>
        <div id="gallery" class="gallery"></div>
      </section>

      <section class="card">
        <div class="row between">
          <strong>Stress test</strong>
          <span id="perf" class="muted">Off</span>
        </div>
        <div class="row">
          <label for="stressCount">Badges</label>
          <input id="stressCount" type="range" min="0" max="200" step="10" value="0" />
          <span id="stressOut" class="readout">0</span>
        </div>
        <div id="stress" class="stress"></div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
