name: Deploy

# Every merge to main builds every service's image, pushes it to Docker Hub, and
# rolls the VPS onto it. Settings and secrets come from the GitHub "production"
# environment; deploy/README.md lists them.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer merge waits instead of cancelling one mid-rollout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { service: joined-backend, dockerfile: docker/go-service.Dockerfile, arg: SERVICE }
          - { service: admin-backend, dockerfile: docker/go-service.Dockerfile, arg: SERVICE }
          - { service: scoutwell-backend, dockerfile: docker/go-service.Dockerfile, arg: SERVICE }
          - { service: joined-frontend, dockerfile: docker/next-app.Dockerfile, arg: APP }
          - { service: admin-frontend, dockerfile: docker/next-app.Dockerfile, arg: APP }
          - { service: scoutwell-frontend, dockerfile: docker/next-app.Dockerfile, arg: APP }
          - { service: connected-frontend, dockerfile: docker/next-app.Dockerfile, arg: APP }
          - { service: joined-theme, dockerfile: docker/next-app.Dockerfile, arg: APP }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # All services share one Docker Hub repository (<user>/joined), told apart by
      # tag, so the whole project fits in a single private repository.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.arg }}=${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/joined:${{ matrix.service }}-${{ env.IMAGE_TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/joined:${{ matrix.service }}-latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to the VPS
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.FRONTEND_ORIGIN }}
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      DEPLOY_DIR: /srv/joined
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: the deploy refuses a server that is not ours.
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Write production settings
        env:
          IMAGE_REPO: ${{ vars.DOCKERHUB_USERNAME }}/joined
          COMPOSE_PROFILES: ${{ vars.COMPOSE_PROFILES }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_REDIRECT_URL: ${{ vars.GOOGLE_REDIRECT_URL }}
          GOOGLE_SIGNIN_REDIRECT_URL: ${{ vars.GOOGLE_SIGNIN_REDIRECT_URL }}
          DEST_DB: ${{ vars.DEST_DB }}
          SCOUTWELL_ORIGIN: ${{ vars.SCOUTWELL_ORIGIN }}
          SCOUTWELL_GOOGLE_SIGNIN_REDIRECT_URL: ${{ vars.SCOUTWELL_GOOGLE_SIGNIN_REDIRECT_URL }}
          SCOUT_PUBLIC_API_URL: ${{ vars.SCOUT_PUBLIC_API_URL }}
          ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          umask 077
          # Single-quoted values are taken literally by Compose; refuse anything
          # that would break out of the quotes rather than write a bad file.
          put() {
            local value="${!1-}"
            if [[ "$value" == *"'"* || "$value" == *$'\n'* ]]; then
              echo "::error::$1 contains a single quote or a newline"
              exit 1
            fi
            printf "%s='%s'\n" "$1" "$value"
          }
          {
            for name in IMAGE_REPO IMAGE_TAG COMPOSE_PROFILES FRONTEND_ORIGIN \
              GOOGLE_CLIENT_ID GOOGLE_REDIRECT_URL GOOGLE_SIGNIN_REDIRECT_URL DEST_DB \
              SCOUTWELL_ORIGIN SCOUTWELL_GOOGLE_SIGNIN_REDIRECT_URL SCOUT_PUBLIC_API_URL \
              ADMIN_ORIGIN MONGO_URI GOOGLE_CLIENT_SECRET OPENAI_API_KEY ADMIN_API_TOKEN \
              GEOAPIFY_API_KEY; do
              put "$name"
            done
          } > production.env

      - name: Ship the stack
        run: |
          scp -q deploy/compose.yml vps:"$DEPLOY_DIR/compose.yml"
          scp -q production.env vps:"$DEPLOY_DIR/.env"
          rm production.env
          ssh vps "chmod 600 '$DEPLOY_DIR/.env'"

      - name: Pull the new images
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # The token travels over SSH's stdin, never on a command line, and the
          # server forgets it as soon as the pull is done.
          printf '%s' "$DOCKERHUB_TOKEN" |
            ssh vps "docker login --username '$DOCKERHUB_USERNAME' --password-stdin >/dev/null"
          ssh vps "cd '$DEPLOY_DIR' && docker compose pull --quiet; status=\$?; docker logout >/dev/null; exit \$status"

      - name: Start the new release
        run: |
          ssh vps "cd '$DEPLOY_DIR' && docker compose up -d --remove-orphans && docker image prune -f >/dev/null"

      - name: Check it is serving
        run: |
          # Inside the VPS, so this checks the containers rather than DNS or TLS.
          ssh vps 'for i in $(seq 1 20); do
              api=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:11080/health)
              web=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:6002/)
              # curl reports 000 when nothing answers, so require a real status below 500.
              if [ "$api" = 200 ] && [ "$web" -ge 200 ] && [ "$web" -lt 500 ]; then
                echo "api $api, web $web"
                exit 0
              fi
              sleep 5
            done
            echo "::error::not healthy: api $api, web $web"
            cd /srv/joined && docker compose ps && docker compose logs --tail=40 joined-backend joined-frontend
            exit 1'
