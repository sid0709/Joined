name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and workspace boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Lint every workspace
        run: bunx turbo run lint --filter=openseat-frontend --filter=openseat-theme --filter=opened-frontend --filter=@openseat/design-system

      - name: Lint repo tools and tests
        run: bun x eslint eslint.config.mjs eslint.shared.mjs commitlint.config.mjs tools tests --max-warnings=0

      - name: Check workspace import boundaries
        run: bun run check:boundaries

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Check formatting
        run: bun run format:check

  typecheck:
    name: Typecheck all workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Typecheck
        run: bunx turbo run typecheck --filter=openseat-frontend --filter=openseat-theme --filter=opened-frontend --filter=@openseat/design-system

  dependencies:
    name: One version per library, one node_modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      # Fails if any package.json declares a version or range instead of "catalog:", if any
      # workspace gets its own node_modules, or if a catalog library is installed twice.
      # The same rules also run inside `bun run test` (tests/dependency-policy.test.js).
      - name: Check the dependency rule
        run: bun run check:deps

  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Run tests and enforce coverage
        run: bun run test

  build:
    name: Build applications
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Build every app
        run: bunx turbo run build --filter=openseat-frontend --filter=openseat-theme --filter=opened-frontend

  commit-conventions:
    name: Check commit conventions and PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Validate pull request commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
      - name: Validate pushed commit messages
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bunx commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA"
      - name: Validate Conventional Commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx commitlint
