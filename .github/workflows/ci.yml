name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and workspace boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      # Every job runs its steps from tools/ci.mjs, so `bun run ci` reproduces CI locally.
      - name: Lint, lint repo tools, check workspace import boundaries
        run: bun run ci lint

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Check formatting
        run: bun run ci format

  typecheck:
    name: Typecheck all workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Typecheck
        run: bun run ci typecheck

  dependencies:
    name: One version per library, one node_modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      # Fails if any package.json declares a version or range instead of "catalog:", if any
      # workspace gets its own node_modules, or if a catalog library is installed twice.
      # The same rules also run inside `bun run test` (tests/dependency-policy.test.js).
      - name: Check the dependency rule
        run: bun run ci dependencies

  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Run tests and enforce coverage
        run: bun run ci test

  go:
    name: Vet and test Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            backend-core/go.sum
            joined-backend/go.sum
            admin-backend/go.sum
            scoutwell-backend/go.sum
      - uses: ./.github/actions/setup-bun
      - name: Vet and test every Go module
        run: bun run ci go

  build:
    name: Build applications
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Build every app
        env:
          # Server-only config the apps read while building; a placeholder is enough (no .env.local in CI).
          JOINED_API_URL: http://127.0.0.1:8080
          SCOUTWELL_API_URL: http://127.0.0.1:8082
        run: bun run ci build

  commit-conventions:
    name: Check commit conventions and PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Validate pull request commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
      - name: Validate pushed commit messages
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bunx commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA"
      - name: Validate Conventional Commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx commitlint

  # Single stable check for branch protection to require. Add every new job's id above to
  # `needs:` here — branch protection then never has to change when CI gains or renames jobs.
  ci-passed:
    name: All CI passed
    if: always()
    needs: [lint, format, typecheck, dependencies, test, go, build, commit-conventions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required CI jobs did not pass:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All required CI jobs passed."
